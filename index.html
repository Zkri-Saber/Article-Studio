<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Manuscript &amp; Style Forensics</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Client-side DOCX and PDF parsers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Manuscript &amp; Style Forensics</h1>
      <p class="subtitle">
        Audit local manuscripts or pasted drafts for inflated AI buzzwords, formulaic transitions, filler phrases, and passive agency.
      </p>
    </header>

    <section class="card">
      <div class="grid-2">
        <div>
          <label for="apiKey">Gemini API Key (saved locally in your browser)</label>
          <input type="password" id="apiKey" placeholder="AQ.... or AIzaSy..." autocomplete="off" />
          <p class="hint">Stored only in your browser's <code>localStorage</code>. Never committed to GitHub.</p>
        </div>
        <div>
          <label for="modelSelect">Gemini Model</label>
          <select id="modelSelect">
            <option value="gemini-2.5-flash" selected>gemini-2.5-flash (Fast &amp; Cost-Effective)</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro (Deep Editorial Review)</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="file-bar">
        <div>
          <label for="fileInput">Upload Local Manuscript (.docx, .pdf, .md, .txt, .html)</label>
          <input type="file" id="fileInput" accept=".txt,.md,.docx,.pdf,.html,.htm" />
        </div>
        <div id="fileMeta" class="file-meta">No file selected</div>
      </div>

      <label for="manuscriptText">Manuscript Text</label>
      <textarea id="manuscriptText" placeholder="Upload a manuscript file above or paste your text directly here..."></textarea>

      <div class="btn-row">
        <button type="button" id="analyzeBtn">Audit Manuscript</button>
        <button type="button" class="secondary" id="sampleBtn">Load Sample Text</button>
        <button type="button" class="secondary" id="clearBtn">Clear</button>
      </div>

      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      </div>
      <div id="statusMsg" class="status"></div>
    </section>

    <section id="reportSection" class="card hidden">
      <div class="summary-header">
        <div>
          <h2>Audit Report</h2>
          <p id="reportStats" class="hint"></p>
        </div>
        <div class="export-group">
          <div id="scoreBadge" class="score-badge">Score: --/100</div>
          <button type="button" class="secondary" id="downloadMdBtn">Export .MD</button>
          <button type="button" class="secondary" id="downloadJsonBtn">Export .JSON</button>
        </div>
      </div>

      <div id="sectionSummaries" class="summaries-box"></div>
      <div id="filterBar" class="filters"></div>
      <div id="findingsList"></div>
    </section>
  </div>
</body>
</html>
