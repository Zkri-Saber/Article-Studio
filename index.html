<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Studio — Offline AI Style Forensics</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23e9d5ff'/%3E%3Cstop offset='100%25' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='36' height='36' rx='10' fill='url(%23g)'/%3E%3Cg transform='translate(6,6)' fill='none' stroke='%231e1b4b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6'/%3E%3Cline x1='8' y1='8' x2='13' y2='8'/%3E%3Cline x1='8' y1='12' x2='11' y2='12'/%3E%3Ccircle cx='16.5' cy='16.5' r='3.5'/%3E%3Cline x1='19.1' y1='19.1' x2='21.5' y2='21.5'/%3E%3Cpath d='M19 2.5l.65 1.85L21.5 5l-1.85.65L19 7.5l-.65-1.85L16.5 5l1.85-.65L19 2.5z' fill='%231e1b4b' stroke='none'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Client-side DOCX and PDF parsers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <style>
    :root {
      --bg-page: #f9f9fb;
      --bg-surface: #ffffff;
      --bg-subtle: #f3f4f6;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text-primary: #18181b;
      --text-secondary: #6b7280;
      --lavender-bg: #f5f3ff;
      --lavender-border: #d8b4fe;
      --lavender-text: #6b21a8;
      --dark-pill: #18181b;
      --danger: #dc2626;
      --warn: #d97706;
      --success: #059669;
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.045), 0 1px 3px rgba(0, 0, 0, 0.03);
      --shadow-chip: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Slim Left Navigation Rail */
    .sidebar {
      width: 72px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px;
      gap: 24px;
      background: var(--bg-page);
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(192, 132, 252, 0.35);
      user-select: none;
    }

    .rail-nav {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      align-items: center;
    }

    .rail-item {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 6px;
      width: 58px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .rail-item:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
    }

    .workspace-tag {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .offline-badge {
      background: var(--dark-pill);
      color: #ffffff;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      user-select: none;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .btn-light-pill {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      box-shadow: var(--shadow-chip);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-light-pill:hover {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
    }

    /* Centered Hero Section */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 64px;
    }

    .hero-section {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 24px;
    }

    .hero-section.compact { margin-top: 0; }

    .hero-title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin: 0 0 26px;
      text-align: center;
    }

    /* Large Rounded Prompt Box */
    .prompt-card {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px 20px 14px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .prompt-card:focus-within {
      border-color: #c4b5fd;
      box-shadow: 0 6px 28px rgba(139, 92, 246, 0.08);
    }

    .attachment-bar { margin-bottom: 10px; }

    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .chip-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }

    .chip-close:hover { color: var(--text-primary); }

    .prompt-textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: vertical;
      background: transparent;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-primary);
      min-height: 112px;
      max-height: 360px;
    }

    .prompt-textarea::placeholder { color: var(--text-secondary); }

    .prompt-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 6px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    /* Lavender Mode Pill */
    .magic-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--lavender-bg);
      border: 1px solid var(--lavender-border);
      color: var(--lavender-text);
      border-radius: 999px;
      padding: 5px 13px;
      height: 34px;
      font-size: 13px;
      font-weight: 500;
      user-select: none;
    }

    .sparkle-icon {
      color: #7c3aed;
      flex-shrink: 0;
    }

    /* Circular Submit Arrow Button */
    .submit-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #8e8e93;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .submit-circle.active { background: var(--dark-pill); }

    .submit-circle:hover {
      background: var(--dark-pill);
      transform: translateY(-1px);
    }

    /* Quick-Action Pill Chips Row */
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .action-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: var(--shadow-chip);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .action-chip:hover {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .action-chip svg { color: var(--text-secondary); }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
    }

    .status.error {
      color: var(--danger);
      font-weight: 500;
    }

    /* Report Section */
    .report-card {
      width: 100%;
      max-width: 860px;
      margin-top: 28px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow-card);
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .report-header h2 {
      margin: 0 0 2px;
      font-size: 18px;
      font-weight: 600;
    }

    .muted-text {
      margin: 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .export-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .score-badge {
      font-size: 13px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }

    .breakdown-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .breakdown-pill {
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .breakdown-pill strong {
      color: var(--text-primary);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-pill {
      background: var(--bg-page);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .filter-pill.active {
      background: var(--lavender-bg);
      border-color: var(--lavender-border);
      color: var(--lavender-text);
      font-weight: 600;
    }

    .finding {
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .finding-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .matched-word {
      font-weight: 600;
      color: var(--warn);
      font-size: 14.5px;
    }

    .cat-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--lavender-bg);
      color: var(--lavender-text);
      border: 1px solid var(--lavender-border);
    }

    .detail-line {
      font-size: 13.5px;
      line-height: 1.55;
      margin: 4px 0;
      color: var(--text-primary);
    }

    .detail-label {
      color: var(--text-secondary);
      font-weight: 600;
      display: inline-block;
      min-width: 78px;
    }

    .rewrite-text {
      color: var(--success);
      font-weight: 500;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0.35);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-card {
      width: 100%;
      max-width: 580px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-body {
      max-height: 62vh;
      overflow-y: auto;
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      background: var(--bg-page);
    }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .sidebar { width: 56px; padding: 12px 4px; }
      .rail-item span { display: none; }
      .hero-title { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Slim Left Navigation Rail -->
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand-badge" title="Article Studio — Offline AI Manuscript Audit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6" />
          <line x1="8" y1="8" x2="13" y2="8" />
          <line x1="8" y1="12" x2="11" y2="12" />
          <circle cx="16.5" cy="16.5" r="3.5" />
          <line x1="19.1" y1="19.1" x2="21.5" y2="21.5" />
          <path d="M19 2.5l.65 1.85L21.5 5l-1.85.65L19 7.5l-.65-1.85L16.5 5l1.85-.65L19 2.5z" fill="#1e1b4b" stroke="none" />
        </svg>
      </div>

      <nav class="rail-nav">
        <button type="button" class="rail-item" id="navNewBtn" title="Start new audit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>New</span>
        </button>

        <button type="button" class="rail-item" id="navHistoryBtn" title="Recent local audits">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <polyline points="12 7 12 12 15 14" />
          </svg>
          <span>History</span>
        </button>

        <button type="button" class="rail-item" id="navRubricBtn" title="Detection categories">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2" />
            <polyline points="2 12 12 17 22 12" />
            <polyline points="2 17 12 22 22 17" />
          </svg>
          <span>Rubric</span>
        </button>

        <button type="button" class="rail-item" id="navExportBtn" title="Download Markdown report">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <path d="M17.5 14v7M14.5 18l3 3 3-3" />
          </svg>
          <span>Export</span>
        </button>
      </nav>
    </aside>

    <!-- Main Workspace -->
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <span class="workspace-tag">Article Studio</span>
        </div>
        <div class="topbar-right">
          <span class="offline-badge" title="Runs 100% locally in your browser without any API key">
            <span class="status-dot"></span>
            <span>Offline Engine • No API</span>
          </span>
          <button type="button" class="btn-light-pill" id="topSampleBtn">Load Sample Draft</button>
        </div>
      </header>

      <main class="main-content" id="mainContainer">
        <section class="hero-section">
          <h1 class="hero-title">What manuscript can I audit?</h1>

          <div class="prompt-card">
            <div id="attachmentBar" class="attachment-bar hidden">
              <div class="attachment-chip">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <polyline points="14 2 14 8 20 8" />
                </svg>
                <span id="fileMeta">manuscript.docx</span>
                <button type="button" id="removeFileBtn" class="chip-close" title="Remove file">&times;</button>
              </div>
            </div>

            <textarea
              id="manuscriptText"
              class="prompt-textarea"
              placeholder="Paste your manuscript draft or attach a .docx, .pdf, .md, .txt, .html file..."
              rows="5"
            ></textarea>

            <input type="file" id="fileInput" accept=".txt,.md,.docx,.pdf,.html,.htm" class="hidden" />

            <div class="prompt-toolbar">
              <div class="toolbar-left">
                <button type="button" class="icon-btn" id="attachBtn" title="Attach local manuscript (.docx, .pdf, .md, .txt, .html)">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                  </svg>
                </button>

                <button type="button" class="icon-btn" id="clearBtn" title="Clear draft">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6M14 11v6" />
                  </svg>
                </button>
              </div>

              <div class="toolbar-right">
                <div class="magic-pill" title="Instant local lexical & syntax forensics">
                  <svg class="sparkle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z" />
                  </svg>
                  <span>Local Forensics</span>
                </div>

                <button type="button" class="submit-circle" id="analyzeBtn" title="Run Instant AI Style Audit">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5" />
                    <polyline points="5 12 12 5 19 12" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="quick-chips">
            <button type="button" class="action-chip" data-action="audit">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <span>Full Audit</span>
            </button>

            <button type="button" class="action-chip" data-action="buzzwords">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">

        .replace(/&/g, "&amp;")

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      currentFileName = file.name.replace(/\.[^/.]+$/, "");
      const ext = file.name.split(".").pop().toLowerCase();
      setStatus(`Reading "${file.name}"...`);

      try {
        let extractedText = "";

        if (ext === "txt" || ext === "md") {
          extractedText = await file.text();
        } else if (ext === "html" || ext === "htm") {
          const rawHtml = await file.text();
          const doc = new DOMParser().parseFromString(rawHtml, "text/html");
          doc.querySelectorAll("script, style, nav, footer, header, aside").forEach(el => el.remove());
          extractedText = doc.body?.innerText || "";
        } else if (ext === "docx") {
          if (!window.mammoth) throw new Error("DOCX parser library failed to load.");
          const arrayBuffer = await file.arrayBuffer();
          const result = await window.mammoth.extractRawText({ arrayBuffer });
          extractedText = result.value;
        } else if (ext === "pdf") {
          if (!window.pdfjsLib) throw new Error("PDF parser library failed to load.");
          window.pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const pages = [];
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            pages.push(content.items.map(item => item.str).join(" "));
          }
          extractedText = pages.join("\n\n");
        } else {
          throw new Error(`Unsupported format ".${ext}".`);

    // Sentence Splitter with Abbreviation & Decimal Protection
    function splitSentences(paragraph) {
      let protectedText = paragraph;
      const abbreviations = [
        /\bDr\./gi, /\bMr\./gi, /\bMs\./gi, /\bMrs\./gi, /\bProf\./gi,
        /\bFig\./gi, /\bEq\./gi, /\bRef\./gi, /\bSec\./gi, /\bVol\./gi, /\bNo\./gi,
        /\bvs\./gi, /\bet al\./gi, /\be\.g\./gi, /\bi\.e\./gi, /\bcf\./gi
      ];
      for (const abbr of abbreviations) {
        protectedText = protectedText.replace(abbr, match => match.replace(/\./g, "<DOT>"));
      }
      protectedText = protectedText.replace(/(\d)\.(\d)/g, "$1<DOT>$2");

      const matches = protectedText.match(/[^.!?]+[.!?]+(?:\s+|$)|[^.!?]+$/g) || [];
      return matches
        .map(s => s.replace(/<DOT>/g, ".").trim())
        .filter(Boolean);
    }

    // Core Offline Audit Engine
    function runOfflineAudit(initialFilter = "All") {
      const text = manuscriptText.value.trim();
      if (!text) {
        setStatus("Paste manuscript text or attach a file first.", true);
        return;
      }

      const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
      const findings = [];
      const wordMatches = text.match(/\b\w+(?:[-']\w+)*\b/g);
      const totalWords = wordMatches ? wordMatches.length : 0;
      let totalSentences = 0;
      let sentenceInitialHits = 0;

      const lexiconGroups = [
        ["Inflated Verb", INFLATED_VERBS, "Overused AI action buzzword that inflates routine actions."],
        ["Inflated Adjective", INFLATED_ADJECTIVES, "Vague promotional qualifier favored by LLMs."],
        ["Inflated Noun", INFLATED_NOUNS, "Abstract metaphor or buzzword noun overrepresented in AI prose."],
        ["Inflated Adverb", INFLATED_ADVERBS, "Intensifying adverb that pads claims without adding data."]
      ];

      paragraphs.forEach((para, pIdx) => {
        const secNum = pIdx + 1;
        const sentences = splitSentences(para);

        sentences.forEach((sent) => {
          totalSentences += 1;

          // 1. Inflated Lexicon
          for (const [category, list, reason] of lexiconGroups) {
            for (const [pattern, suggestion] of list) {
              const rx = new RegExp(pattern, "gi");
              for (const match of sent.matchAll(rx)) {
                findings.push({
                  section: secNum,
                  sentence_num: totalSentences,
                  category,
                  matched_phrase: match[0],
                  sentence_context: sent,
                  reason,
                  suggestion: `Replace with: ${suggestion}.`
                });
              }
            }
          }

          // 2A. Sentence-Initial Adverbs
          for (const [pattern, suggestion] of SENTENCE_INITIAL_ADVERBS) {
            const match = sent.match(new RegExp(pattern, "i"));
            if (match) {
              sentenceInitialHits += 1;
              findings.push({
                section: secNum,
                sentence_num: totalSentences,
                category: "Sentence-Initial Adverb",
                matched_phrase: match[0],
                sentence_context: sent,
                reason: "Formulaic sentence-opening adverb commonly chained by AI models.",
                suggestion
              });
            }
          }

          // 2B. Rigid List Signposts
          for (const [pattern, suggestion] of RIGID_LIST_SIGNPOSTS) {
            const match = sent.match(new RegExp(pattern, "i"));
            if (match) {
              findings.push({
                section: secNum,
                sentence_num: totalSentences,
                category: "Rigid List Signpost",
                matched_phrase: match[0],
                sentence_context: sent,
                reason: "Mechanical structural signpost typical of templated LLM outlines.",
                suggestion
              });
            }
          }

          // 2C. Filler Phrases
          for (const [pattern, suggestion] of FILLER_PHRASES) {
            const rx = new RegExp(pattern, "gi");
            for (const match of sent.matchAll(rx)) {
              findings.push({
                section: secNum,
                sentence_num: totalSentences,
                category: "Filler Phrase",
                matched_phrase: match[0],
                sentence_context: sent,
                reason: "Empty stock throat-clearing phrase that adds word count without meaning.",
                suggestion
              });
            }
          }

          // 3A. Disembodied / Automated Phrasing
          for (const match of sent.matchAll(new RegExp(ABSTRACT_SUBJECT_PATTERN, "gi"))) {
            findings.push({
              section: secNum,
              sentence_num: totalSentences,
              category: "Disembodied / Automated Phrasing",
              matched_phrase: match[0].trim(),
              sentence_context: sent,
              reason: "Non-human tool, model, or abstract noun performs a human-agency verb.",
              suggestion: "Name the human actor (e.g., 'Clinicians used the model to...' or 'We analyzed...')."
            });
          }

          // 3B. Passive Constructions
          for (const match of sent.matchAll(new RegExp(PASSIVE_VOICE_PATTERN, "gi"))) {
            const participle = (match[1] || "").toLowerCase();
            if (PASSIVE_FALSE_POSITIVES.has(participle)) continue;
            findings.push({
              section: secNum,
              sentence_num: totalSentences,
              category: "Passive Construction",
              matched_phrase: match[0],
              sentence_context: sent,
              reason: "Passive verb construction obscures who performed the action.",
              suggestion: "Convert to active voice with an explicit human subject where appropriate."
            });
          }
        });
      });

      const counts = {};
      for (const f of findings) {
        counts[f.category] = (counts[f.category] || 0) + 1;
      }

      const safeWords = Math.max(1, totalWords);
      const safeSentences = Math.max(1, totalSentences);

      const weightedPoints =
        (counts["Inflated Verb"] || 0) * 2.5 +
        (counts["Inflated Adjective"] || 0) * 2.2 +
        (counts["Inflated Noun"] || 0) * 2.5 +
        (counts["Inflated Adverb"] || 0) * 2.0 +
        (counts["Sentence-Initial Adverb"] || 0) * 3.0 +
        (counts["Rigid List Signpost"] || 0) * 3.0 +
        (counts["Filler Phrase"] || 0) * 3.5 +
        (counts["Disembodied / Automated Phrasing"] || 0) * 3.0 +
        (counts["Passive Construction"] || 0) * 1.2;

      const densityScore = (weightedPoints / safeWords) * 180;
      const transitionBonus = (sentenceInitialHits / safeSentences) * 35;
      const overallScore = Math.min(100, Math.round(densityScore + transitionBonus));

      currentReport = {
        manuscript: currentFileName,
        overall_ai_style_score: overallScore,
        total_words: totalWords,
        total_sentences: totalSentences,
        total_findings: findings.length,
        category_breakdown: counts,
        findings
      };

      const history = JSON.parse(localStorage.getItem("offline_audit_history") || "[]");
      history.unshift(currentReport);
      localStorage.setItem("offline_audit_history", JSON.stringify(history.slice(0, 10)));

      activeCategory = initialFilter;
      renderReport();
      setStatus(`Offline audit complete — scanned ${totalWords.toLocaleString()} words locally.`);
    }

    function renderReport() {
      if (!currentReport) return;

      heroSection.classList.add("compact");
      reportSection.classList.remove("hidden");

      const score = currentReport.overall_ai_style_score;
      scoreBadge.textContent = `AI Style Score: ${score}/100`;
      scoreBadge.style.color = score >= 65 ? "var(--danger)" : score >= 35 ? "var(--warn)" : "var(--success)";

      reportStats.textContent = `${currentReport.total_words.toLocaleString()} words • ${currentReport.total_sentences.toLocaleString()} sentences • ${currentReport.total_findings} flagged instance(s)`;

      const entries = Object.entries(currentReport.category_breakdown).sort((a, b) => b[1] - a[1]);
      breakdownBox.innerHTML = entries.length === 0
        ? `<div class="breakdown-pill">No AI-favored buzzwords, stock transitions, or passive agency patterns detected.</div>`
        : entries.map(([cat, count]) => `<div class="breakdown-pill">${escapeHtml(cat)}: <strong>${count}</strong></div>`).join("");

      const categories = ["All", ...Object.keys(currentReport.category_breakdown)];
      filterBar.innerHTML = "";
      categories.forEach(cat => {
        const count = cat === "All"
          ? currentReport.findings.length
          : (currentReport.category_breakdown[cat] || 0);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `filter-pill ${activeCategory === cat ? "active" : ""}`;
        btn.textContent = `${cat} (${count})`;
        btn.addEventListener("click", () => {
          activeCategory = cat;
          renderReport();
        });
        filterBar.appendChild(btn);
      });

      let visible = currentReport.findings;
      if (activeCategory.startsWith("GROUP:")) {
        const groupKey = activeCategory.split(":")[1];
        const allowed = CATEGORY_GROUPS[groupKey] || [];
        visible = currentReport.findings.filter(f => allowed.includes(f.category));
      } else if (activeCategory !== "All") {
        visible = currentReport.findings.filter(f => f.category === activeCategory);
      }

      findingsList.innerHTML = visible.length === 0
        ? `<p class="muted-text">No instances flagged in this category.</p>`
        : visible.map((item, idx) => `
          <div class="finding">
            <div class="finding-top">
              <span class="matched-word">#${idx + 1} "${escapeHtml(item.matched_phrase)}"</span>
              <span class="cat-tag">Para ${item.section} • Sent ${item.sentence_num} • ${escapeHtml(item.category)}</span>
            </div>
            <div class="detail-line"><span class="detail-label">Sentence:</span> ${escapeHtml(item.sentence_context)}</div>
            <div class="detail-line"><span class="detail-label">Why:</span> ${escapeHtml(item.reason)}</div>
            <div class="detail-line rewrite-text"><span class="detail-label">Suggestion:</span> ${escapeHtml(item.suggestion)}</div>
          </div>
        `).join("");
    }

    function triggerDownload(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("downloadJsonBtn").addEventListener("click", () => {
      if (!currentReport) return;
      triggerDownload(
        JSON.stringify(currentReport, null, 2),
        `${currentFileName}_offline_ai_audit.json`,
        "application/json"
      );
    });

    document.getElementById("downloadMdBtn").addEventListener("click", () => {
      if (!currentReport) return;
      const lines = [
        `# Offline AI Style & Phrasing Audit: \`${currentReport.manuscript}\``,
        "",
        `- **AI Style Score:** ${currentReport.overall_ai_style_score}/100`,
        `- **Word Count:** ${currentReport.total_words.toLocaleString()}`,
        `- **Sentence Count:** ${currentReport.total_sentences.toLocaleString()}`,
        `- **Flagged Instances:** ${currentReport.total_findings}`,
        "",
        "## Category Breakdown",
        ""
      ];

      Object.entries(currentReport.category_breakdown)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cat, count]) => lines.push(`- **${cat}:** ${count}`));

      lines.push("", "## Flagged Phrases & Editorial Suggestions", "");

      currentReport.findings.forEach((f, idx) => {
        lines.push(
          `### ${idx + 1}. [${f.category}] \`${f.matched_phrase}\` (Paragraph ${f.section}, Sentence ${f.sentence_num})`,
          `- **Sentence:** ${f.sentence_context}`,
          `- **Why flagged:** ${f.reason}`,
          `- **Edit guidance:** ${f.suggestion}`,
          ""
        );
      });

      triggerDownload(lines.join("\n"), `${currentFileName}_offline_ai_audit.md`, "text/markdown");
    });
  </script>
